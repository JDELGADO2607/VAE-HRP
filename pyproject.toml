[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-hrp"
version = "0.1.0"
description = "Paridad de Riesgo Jerárquica con Autoencoders Variacionales en el Mercado Integrado NUAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gonzalo Ramírez-Carrillo" },
    { name = "Óscar Carrillo-García" },
    { name = "Smaily Arenas-Contreras" },
    { name = "Juan M. Delgado" }
]
dependencies = [
    "torch>=2.1.0",
    "optuna>=5.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pymupdf>=1.24.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]
